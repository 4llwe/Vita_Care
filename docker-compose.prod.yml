services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: "${POSTGRES_USER:?required}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}", POSTGRES_DB: "${POSTGRES_DB:?required}" }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10 }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256mb
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD:?required}"]
    volumes: ["redisdata:/data"]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 10s, timeout: 5s, retries: 10 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?required}" }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: ${ENV_FILE:-.env.production}
    command: ["./node_modules/.bin/prisma","migrate","deploy"]
    depends_on: { db: { condition: service_healthy } }
    networks: [backend]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [backend,edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 768m
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    cpus: 0.75
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  edge:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    depends_on: { web: { condition: service_healthy }, api: { condition: service_healthy } }
    ports: ["80:80","443:443"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro","./infra/tls:/etc/nginx/tls:ro"]
    read_only: true
    tmpfs: ["/var/cache/nginx","/var/run"]
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
networks: { backend: { internal: true }, edge: {} }
volumes: { pgdata: {}, redisdata: {} }
