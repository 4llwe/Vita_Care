name: Production readiness
on: [pull_request, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vitacare, POSTGRES_PASSWORD: vitacare_test, POSTGRES_DB: vitacare_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vitacare:vitacare_test@localhost:5432/vitacare_test
      JWT_ACCESS_SECRET: "ci-access-secret-0123456789abcdef"
      JWT_REFRESH_SECRET: "ci-refresh-secret-0123456789abcdef"
      ENCRYPTION_KEY: "ci-encryption-key-0123456789abcdef"
      WEB_ORIGIN: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      E2E_WEB_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:3001
      SEED_ADMIN_EMAIL: ci-admin@vitacare.invalid
      SEED_ADMIN_PASSWORD: CI-only-password-2026!
      SEED_MASTER_DATA: "false"
      E2E_ADMIN_EMAIL: ci-admin@vitacare.invalid
      E2E_ADMIN_PASSWORD: CI-only-password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: sh scripts/check-migrations.sh
      - run: pnpm prisma migrate deploy
      - run: pnpm seed
      - run: pnpm verify:menus
      - run: pnpm lint
      - run: pnpm --filter api test -- --runInBand
      - run: pnpm build
      - run: pnpm --filter e2e install:browsers
      - name: Start API and web
        run: |
          node apps/api/dist/main.js > /tmp/vc-api.log 2>&1 & echo $! > /tmp/vc-api.pid
          pnpm --filter web start > /tmp/vc-web.log 2>&1 & echo $! > /tmp/vc-web.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/api/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          echo "Services did not become ready" >&2
          cat /tmp/vc-api.log /tmp/vc-web.log >&2 || true
          exit 1
      - run: pnpm --filter e2e test
