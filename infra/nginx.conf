events {}
http { server_tokens off; limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s; upstream web_upstream { server web:3000; } upstream api_upstream { server api:3001; } server { listen 80; return 301 https://$host$request_uri; } server { listen 443 ssl http2; ssl_certificate /etc/nginx/tls/fullchain.pem; ssl_certificate_key /etc/nginx/tls/privkey.pem; ssl_protocols TLSv1.2 TLSv1.3; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; client_max_body_size 10m; location /api/ { limit_req zone=public_api burst=20 nodelay; proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } location / { proxy_pass http://web_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $request_id; } } }
